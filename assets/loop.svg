<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">The Mythify loop</title>
  <desc id="d">Plan leads to Act, Act leads to Verify. Exit 0 completes the step. Any other result returns to Act. State lives in .mythify/.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="10" fill="#14110E" stroke="#2E2820"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#1C1814"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#2E2820"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#E8A54B" letter-spacing="1.5">EVIDENCE LOOP</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#A09078" text-anchor="end">RED STAYS OPEN  GREEN ADVANCES</text>

  <g transform="translate(48 90)">
    <rect width="240" height="180" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="24" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">01</text>
    <text x="24" y="92" class="sans" font-size="28" font-weight="700" fill="#F5EFE4">PLAN</text>
    <text x="24" y="128" class="sans" font-size="15" fill="#A09078">Name the steps and</text>
    <text x="24" y="150" class="sans" font-size="15" fill="#A09078">the check for each.</text>
  </g>
  <text x="320" y="190" class="mono" font-size="28" fill="#E8A54B">-</text>
  <g transform="translate(360 90)">
    <rect width="240" height="180" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="24" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">02</text>
    <text x="24" y="92" class="sans" font-size="28" font-weight="700" fill="#F5EFE4">ACT</text>
    <text x="24" y="128" class="sans" font-size="15" fill="#A09078">Do the work. Leave</text>
    <text x="24" y="150" class="sans" font-size="15" fill="#A09078">belief out of it.</text>
  </g>
  <text x="632" y="190" class="mono" font-size="28" fill="#E8A54B">-</text>
  <g transform="translate(672 90)">
    <rect width="240" height="180" rx="4" fill="#1C1814" stroke="#E8A54B"/>
    <text x="24" y="48" class="mono" font-size="28" font-weight="700" fill="#E8A54B">03</text>
    <text x="24" y="92" class="sans" font-size="28" font-weight="700" fill="#F5EFE4">VERIFY</text>
    <text x="24" y="128" class="sans" font-size="15" fill="#A09078">Run the command.</text>
    <text x="24" y="150" class="sans" font-size="15" fill="#A09078">Record exit 0 or not.</text>
  </g>
  <g transform="translate(948 90)">
    <rect width="204" height="180" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="48" class="mono" font-size="14" font-weight="700" fill="#A09078" letter-spacing="1.5">LEDGER</text>
    <text x="20" y="92" class="mono" font-size="22" font-weight="700" fill="#E8A54B">.mythify/</text>
    <text x="20" y="128" class="sans" font-size="14" fill="#A09078">Plans, checks,</text>
    <text x="20" y="150" class="sans" font-size="14" fill="#A09078">and lessons.</text>
  </g>
</svg>
