<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">mythify 7.2.0</title>
  <desc id="d">mythify wordmark with the line: prove done. A status board lists plan, act, verify, exit 0 gate, and .mythify/ artifacts.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="#14110E" stroke="#2E2820"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#1C1814"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#2E2820"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#E8A54B" letter-spacing="1.5">MYTHIFY 7.2.0</text>
  <text x="600" y="28" class="mono" font-size="13" fill="#A09078" text-anchor="middle">@hxp-tools/mythify</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#A09078" text-anchor="end">PRESS START  mythify</text>

  <text x="52" y="168" class="sans" font-size="92" font-weight="800" fill="#F5EFE4" letter-spacing="-3">mythify</text>
  <rect x="52" y="188" width="56" height="6" fill="#E8A54B"/>
  <text x="52" y="238" class="sans" font-size="28" font-weight="600" fill="#F5EFE4">Prove done.</text>
  <text x="52" y="276" class="sans" font-size="28" font-weight="600" fill="#F5EFE4">A step closes only on exit 0.</text>
  <text x="52" y="318" class="sans" font-size="17" fill="#A09078">Executed checks. Plans on disk. Any model. Zero dependencies.</text>

  <g transform="translate(776 76)">
    <rect width="392" height="270" rx="4" fill="#1C1814" stroke="#2E2820"/>
    <text x="20" y="31" class="mono" font-size="12" font-weight="700" fill="#A09078" letter-spacing="2">STATUS BOARD</text>
    <line x1="0" y1="46" x2="392" y2="46" stroke="#2E2820"/>
    <g class="sans" font-size="17" fill="#F5EFE4">
      <text x="20" y="80">Loop</text>
      <text x="20" y="124">Gate</text>
      <text x="20" y="168">Runtime</text>
      <text x="20" y="212">State</text>
      <text x="20" y="256">Artifacts</text>
    </g>
    <g class="mono" font-size="22" font-weight="700" fill="#E8A54B" text-anchor="end">
      <text x="372" y="80">PLAN ACT VERIFY</text>
      <text x="372" y="124">EXIT 0</text>
      <text x="372" y="168">PYTHON 3.9+</text>
      <text x="372" y="212">ON DISK</text>
      <text x="372" y="256">.mythify/</text>
    </g>
    <g stroke="#2E2820">
      <line x1="0" y1="90" x2="392" y2="90"/><line x1="0" y1="134" x2="392" y2="134"/>
      <line x1="0" y1="178" x2="392" y2="178"/><line x1="0" y1="222" x2="392" y2="222"/>
    </g>
  </g>
</svg>
