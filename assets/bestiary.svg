<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
  <title id="t">Mythify bestiary</title>
  <desc id="d">Six ways agents fake done, each beaten by a Mythify check. The hallucination: verify run. The echo: no-op check warning. The shrinking suite: the test-count floor. The amnesiac: mythify status. The mimic: human-input in the person's words. The hydra: round four needs rethink.</desc>
