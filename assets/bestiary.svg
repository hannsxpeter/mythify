<text x="156" y="36" class="mono" font-size="12" fill="#8C86B8" letter-spacing="1.5">No.06</text>
<text x="156" y="62" class="mono" font-size="16" font-weight="700" fill="#EDE9FF">THE HYDRA</text>
<text x="156" y="86" class="mono" font-size="11" font-weight="700" fill="#2EC4B6" letter-spacing="1">TYPE: ENDLESS REVIEW</text>
<text x="156" y="120" class="mono" font-size="11" fill="#8C86B8" letter-spacing="1.5">THREAT</text>
<rect x="156" y="128" width="14" height="10" fill="#2EC4B6"/>
