name: Bug report
description: Report a defect in the Mythify CLI, MCP server, installer, protocol files, skills, or docs.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Mythify grounds bug reports in command output:
        please paste exactly what the tool printed, not a summary of it.
        Reports without reproduction commands and real output are hard to act on.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of Mythify misbehaves?
      options:
        - CLI (scripts/mythify.py, the mythify command)
        - MCP server (scripts/mythify_mcp.py, mythify mcp, mythify-mcp)
        - Installer or uninstaller (scripts/install_user.sh, mythify-uninstall)
        - Protocol files (protocol/PROTOCOL.md, AGENTS.md, CLAUDE.md)
        - Chat skills (skills/, dist/mythify.skill)
        - Documentation (README.md, docs/)
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      description: How are you running Mythify?
      options:
        - Installed with scripts/install_user.sh from a clone
        - Installed from the mythify-cli release archive
        - Run from a clone with python3 scripts/mythify.py
        - MCP server registered with an MCP client
        - Chat skill imported into an agent
    validations:
      required: true
  - type: input
    id: mythify-version
    attributes:
      label: Mythify version
      description: Output of mythify --version (or python3 scripts/mythify.py --version).
      placeholder: Mythify v6.0.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: >
        Exact commands or tool calls, in order, starting from a clean state
        (for example a fresh directory after mythify init). Include any
        relevant environment variables such as MYTHIFY_DIR,
        MYTHIFY_DISABLE_RUN, or MYTHIFY_MCP_CALL_TIMEOUT.
      placeholder: |
        1. mythify init
        2. mythify plan create "Demo" --steps '[{"title": "A"}]'
        3. mythify step 1 completed "done"
    validations:
      required: true
  - type: textarea
    id: actual-output
    attributes:
      label: Actual output
      description: >
        What did the CLI or the MCP tool actually print? Paste the verbatim
        output, including any [OK], [FAIL], or [WARN] lines, the exit code (or
        the exit_code line of an MCP result), and stdout or stderr tails. If a
        state file under .mythify/ ended up wrong, paste the relevant lines
        from it too.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: >
        What should have happened instead? If the behavior is documented in
        a command's --help output or in docs/, quote or link the line.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of python3 --version (the CLI and MCP server require 3.9+).
      placeholder: Python 3.12.4
