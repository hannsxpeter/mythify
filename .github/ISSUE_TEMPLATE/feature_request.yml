name: Feature request
description: Propose a change or addition to the Mythify CLI, MCP server, protocol, or skills.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Mythify favors proportional ceremony: small surface, strict contracts,
        no runtime dependencies, and no model or vendor routing. The strongest
        proposals name a concrete failure of the current tooling and a
        behavior precise enough to test.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: >
        What goes wrong or is missing today? Describe the situation where the
        current CLI commands, MCP tools, protocol rules, or skill content fall
        short, ideally with the command or tool call you reached for and could
        not complete.
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: >
        Describe the new or changed behavior precisely. For CLI changes,
        sketch the subcommand grammar and exit codes (0 ok, 1 refusal, 2
        unverified verdict, 64 usage error). For state changes, name the exact
        fields and files under .mythify/. The MCP server generates its typed
        tools from the CLI parser, so a CLI change reaches MCP clients without
        a second implementation.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How would we verify it?
      description: >
        The command or test that would fail today and pass once the change
        lands.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Optional. Workarounds you tried, or why existing commands such as
        verify run, memory set, lesson add, or the mythify MCP tool do not
        cover this.
  - type: checkboxes
    id: contract
    attributes:
      label: Contract acknowledgment
      description: CLI commands, MCP tools, and on-disk formats are contracts.
      options:
        - label: I understand that a change to CLI commands, MCP tools, or on-disk formats must ship with tests and updated docs, and must pass python3 scripts/lint.py and the full test suite.
          required: true
