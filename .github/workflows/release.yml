name: Release assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-build-release:
    name: Verify, build, and publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate release tag and CLI version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/package_cli.py --check-release-tag "$TAG"
      - name: Run Python suite
        run: python3 -m unittest discover -s tests -v
      - name: Run distribution and MCP server tests
        run: python3 -m unittest tests.test_install_user tests.test_release_checksums tests.test_mcp_server tests.test_release_version -v
      - name: Check protocol variants and whitespace
        run: |
          python3 scripts/mythify.py protocol check AGENTS.md CLAUDE.md
          git diff --check
      - name: Lint
        run: python3 scripts/lint.py
      - name: Build skill package
        run: python3 scripts/package_skill.py
      - name: Build standalone CLI package
        run: python3 scripts/package_cli.py
      - name: Build and verify flat release checksums
        run: |
          mkdir -p dist/release-assets
          cp dist/mythify.skill dist/mythify-cli-*.tar.gz dist/release-assets/
          python3 scripts/build_release_checksums.py \
            --output dist/release-assets/SHA256SUMS \
            dist/release-assets/mythify.skill \
            dist/release-assets/mythify-cli-*.tar.gz
          python3 scripts/build_release_checksums.py \
            --check dist/release-assets/SHA256SUMS \
            --directory dist/release-assets
      - name: Create verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          dist/release-assets/*
          --verify-tag
          --title "Mythify $TAG"
          --generate-notes
