name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Generated protocol files are in sync
        run: |
          python scripts/build_variants.py
          git diff --exit-code CLAUDE.md AGENTS.md .cursorrules scripts/mythify_protocol.py
      - name: Prose quality
        run: python scripts/check_prose_quality.py
      - name: Installer and MCP server smoke
        run: |
          mkdir -p "$RUNNER_TEMP/mythify-project"
          XDG_DATA_HOME="$RUNNER_TEMP/mythify-data" scripts/install_user.sh \
            --prefix "$RUNNER_TEMP/mythify-install" \
            --project "$RUNNER_TEMP/mythify-project"
          (cd "$RUNNER_TEMP/mythify-project" && "$RUNNER_TEMP/mythify-install/bin/mythify" status)
          test -x "$RUNNER_TEMP/mythify-install/bin/mythify-mcp"
          python - <<'PY'
          import json
          import os
          import subprocess

          runner_temp = os.environ["RUNNER_TEMP"]
          env = dict(os.environ)
          env["MYTHIFY_DIR"] = os.path.join(runner_temp, "mythify-project", ".mythify")
          requests = [
              {
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "initialize",
                  "params": {
                      "protocolVersion": "2025-11-25",
                      "capabilities": {},
                      "clientInfo": {"name": "mythify-ci-install", "version": "1.0.0"},
                  },
              },
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
              {
                  "jsonrpc": "2.0",
                  "id": 3,
                  "method": "tools/call",
                  "params": {"name": "status", "arguments": {}},
              },
          ]
          completed = subprocess.run(
              [os.path.join(runner_temp, "mythify-install", "bin", "mythify-mcp")],
              input="".join(json.dumps(item) + "\n" for item in requests),
              capture_output=True,
              text=True,
              env=env,
              timeout=120,
              check=True,
          )
          responses = {}
          for line in completed.stdout.splitlines():
              message = json.loads(line)
              responses[message["id"]] = message
          assert responses[1]["result"]["protocolVersion"] == "2025-11-25", responses[1]
          names = [tool["name"] for tool in responses[2]["result"]["tools"]]
          assert "verify_run" in names and "mythify" in names, names
          assert responses[3]["result"]["isError"] is False, responses[3]
          print("MCP smoke passed: {0} tools listed.".format(len(names)))
          PY
      - name: ASCII rules
        run: |
          python - <<'PY'
          import subprocess
          import sys

          SKIP = {"docs/research-report.md"}

          def is_banned(codepoint):
              if codepoint in (0x2013, 0x2014, 0xFE0F):
                  return True
              if 0x1F000 <= codepoint <= 0x1FAFF:
                  return True
              if 0x2600 <= codepoint <= 0x27BF:
                  return True
              if 0x2B00 <= codepoint <= 0x2BFF:
                  return True
              return False

          listing = subprocess.run(
              ["git", "ls-files"],
              capture_output=True,
              text=True,
              check=True,
          )
          problems = []
          for path in listing.stdout.splitlines():
              if path in SKIP:
                  continue
              try:
                  with open(path, encoding="utf-8") as handle:
                      lines = handle.readlines()
              except (OSError, UnicodeDecodeError):
                  continue
              for lineno, line in enumerate(lines, start=1):
                  for char in line:
                      codepoint = ord(char)
                      if is_banned(codepoint):
                          problems.append(
                              "{0}:{1}: U+{2:04X}".format(path, lineno, codepoint)
                          )
          if problems:
              print("Banned characters found (dashes or emoji):")
              for problem in problems:
                  print(problem)
              sys.exit(1)
          print("ASCII rules check passed.")
          PY
